apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openproject-data-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "{{ .Values.storage.className }}"
  resources:
    requests:
      storage: "{{ .Values.storage.openprojectDataSize }}"