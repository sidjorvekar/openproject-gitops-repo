apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openproject-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: "openproject-postgresql"
  replicas: 1
  selector:
    matchLabels:
      app: openproject-postgresql
  template:
    metadata:
      labels:
        app: openproject-postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.image.postgres.repository }}:{{ .Values.image.postgres.tag }}"
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: openproject-db-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "{{ .Values.storage.className }}"
        resources:
          requests:
            storage: "{{ .Values.storage.postgresSize }}"
---
apiVersion: v1
kind: Service
metadata:
  name: openproject-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: openproject-postgresql