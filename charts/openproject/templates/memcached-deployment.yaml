apiVersion: apps/v1
kind: Deployment
metadata:
  name: openproject-memcached
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openproject-memcached
  template:
    metadata:
      labels:
        app: openproject-memcached
    spec:
      containers:
        - name: memcached
          image: "{{ .Values.image.memcached.repository }}:{{ .Values.image.memcached.tag }}"
          ports:
            - containerPort: 11211
---
apiVersion: v1
kind: Service
metadata:
  name: openproject-memcached
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 11211
      targetPort: 11211
  selector:
    app: openproject-memcached