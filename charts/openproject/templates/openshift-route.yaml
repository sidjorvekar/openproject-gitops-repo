apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: openproject-route
  namespace: {{ .Release.Namespace }}
spec:
  host: "{{ .Values.domain }}"
  to:
    kind: Service
    name: openproject-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect